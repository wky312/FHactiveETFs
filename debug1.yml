            - text: 權重為佔該基金淨值比例（holding.prate）。「等權平均」把每檔 ETF 等重看待，未持有記 0； 「市值加權」以各檔估計淨資產加權，回答「全市場主動 ETF 的錢有多少比例押在這些股票」。
