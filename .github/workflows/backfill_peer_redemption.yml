name: Backfill Peer Redemption Data

on:
  workflow_dispatch:  # manual trigger only
    inputs:
      start_date:
        description: 'Backfill start date (YYYY-MM-DD)'
        required: false
        default: '2025-12-08'

jobs:
  backfill:
    runs-on: ubuntu-latest
    # 觀測群從 6 檔擴到 21 檔，且多數來源改成「掃公告日候選再對齊資料日」（每檔最多 5 次請求），
    # 單日約 11-18 秒 × ~167 個交易日 ≈ 50-90 分鐘，CI 網路更慢 → 從 90 拉到 180 才不會半路被砍。
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests pytz supabase

      - name: Run backfill script
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          START_DATE:           ${{ github.event.inputs.start_date }}
        run: python scripts/backfill_peer_redemption.py
