name: Backfill Peer Redemption Data

on:
  workflow_dispatch:  # manual trigger only
    inputs:
      start_date:
        description: 'Backfill start date (YYYY-MM-DD)'
        required: false
        default: '2025-12-08'
      ignore_complete:
        description: '已有完整資料的日期也重抓覆寫（換資料來源後用，例：00998A 由 CMoney 改吃官方）'
        required: false
        type: boolean
        default: false
      only_tickers:
        description: '只回補這幾檔（逗號分隔，例：0050,0056,00878,00919,00929,00712）。留空＝全部'
        required: false
        default: ''

jobs:
  backfill:
    runs-on: ubuntu-latest
    # 觀測群從 6 檔擴到 21 檔，且多數來源改成「掃公告日候選再對齊資料日」（每檔最多 5 次請求），
    # 單日約 11-18 秒 × ~167 個交易日 ≈ 50-90 分鐘，CI 網路更慢 → 從 90 拉到 180 才不會半路被砍。
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests pytz supabase

      - name: Run backfill script
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          START_DATE:           ${{ github.event.inputs.start_date }}
          # ⚠ 一定要拿去跟 'true' 比：github.event.inputs.<boolean> 回的是**字串**，
          #   `'false' && '1'` 在 GH 運算式裡是 truthy → 沒勾也會變成 '1'，等於這個開關
          #   一直是開著的、每次回補都整段重抓。
          IGNORE_COMPLETE:      ${{ github.event.inputs.ignore_complete == 'true' && '1' || '' }}
          ONLY_TICKERS:         ${{ github.event.inputs.only_tickers }}
        run: python scripts/backfill_peer_redemption.py
