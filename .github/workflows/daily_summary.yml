name: Daily Holdings Summary

on:
  workflow_dispatch:  # triggered by cron-job.org via /api/cron/trigger
    inputs:
      test_date:
        description: '手動測試：只送指定日期的 00991A 進出場摘要 Pushover（YYYY-MM-DD，留空為正常每日排程）'
        required: false
        default: ''

jobs:
  send-summary:
    runs-on: ubuntu-latest
    # 15 分鐘在 2026-08-27/28 連兩天被 cancel：觀測群長到 23 檔，加上每天的補洞掃描，
    # 正常跑就已經 10 分鐘起跳。補洞排在最後，一旦被砍就永遠輪不到它跑。
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      # 套件清單直接寫在下面的 run 裡（無 requirements.txt），所以 key 綁這個 workflow 檔的 hash：
      # 改了清單就自動 miss、重新安裝。
      - name: Cache pip downloads
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('.github/workflows/daily_summary.yml') }}

      - name: Install Python dependencies
        run: pip install playwright requests pytz yfinance supabase

      # 瀏覽器本體約 170MB，快取後省下每次下載；key 綁 playwright 版本，升版自動 miss。
      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(playwright --version | tr -d '\r' | awk '{print $NF}')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.pw.outputs.version }}

      - name: Install Playwright browser
        # 命中快取時只做版本檢查；--with-deps 的 apt 套件無法跨 run 保留，仍會執行。
        run: playwright install chromium --with-deps

      - name: Run daily summary script
        env:
          PUSHOVER_TOKEN:      ${{ secrets.PUSHOVER_TOKEN }}
          PUSHOVER_USER:       ${{ secrets.PUSHOVER_USER }}
          SUPABASE_URL:        ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          TEST_DATE:           ${{ github.event.inputs.test_date }}
          # Email 副本（與 Pushover 同內容、同時機）。GMAIL_APP_PASSWORD 是 Google 帳號的
          # 「應用程式密碼」（非登入密碼），做法同 fantasy-baseball repo。
          # 三個 env 沒設齊時 send_email() 會靜默略過，不影響 Pushover。
          GMAIL_USER:          ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD:  ${{ secrets.GMAIL_APP_PASSWORD }}
          REPORT_EMAIL_TO:     107307017@g.nccu.edu.tw
        run: python scripts/daily_summary.py
