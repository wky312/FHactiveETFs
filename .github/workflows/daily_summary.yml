name: Daily Holdings Summary

on:
  workflow_dispatch:  # triggered by cron-job.org via /api/cron/trigger

jobs:
  send-summary:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install playwright requests pytz yfinance

      - name: Install Playwright browser
        run: playwright install chromium --with-deps

      - name: Run daily summary script
        env:
          PUSHOVER_TOKEN: ${{ secrets.PUSHOVER_TOKEN }}
          PUSHOVER_USER:  ${{ secrets.PUSHOVER_USER }}
        run: python scripts/daily_summary.py
