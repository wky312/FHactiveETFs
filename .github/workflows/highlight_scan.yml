name: Daily Highlight Scan

on:
  schedule:
    - cron: '0 6 * * 1-5'   # 平日 14:00 台北名目時間（台股 13:30 收盤＋報價延遲 15 分，14:00 已足夠；
                            # GH cron 實際延遲 2-4h → 約 16:00-18:00 送達；準時性可由 cron-job.org
                            # 直打 workflow_dispatch API 接管，兩者並存安全：腳本冪等）
  workflow_dispatch:
    inputs:
      force:
        description: '強制重推（略過同日冪等鎖，調整閾值後重跑用）'
        required: false
        default: 'false'
      scan_date:
        description: '指定掃描日 YYYY-MM-DD（留空＝今日）'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests pytz yfinance

      - name: Run highlight scan
        env:
          # LINE_CHANNEL_TOKEN/LINE_TO（etf-daily-line 同組值）優先；未設時退回本 repo 既有 secrets
          LINE_CHANNEL_TOKEN:     ${{ secrets.LINE_CHANNEL_TOKEN || secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_TO:                ${{ secrets.LINE_TO || secrets.LINE_USER_ID }}
          SUPABASE_URL:           ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY:   ${{ secrets.SUPABASE_SERVICE_KEY }}
          ATTR_SUPABASE_URL:      ${{ secrets.ATTR_SUPABASE_URL }}
          ATTR_SUPABASE_ANON_KEY: ${{ secrets.ATTR_SUPABASE_ANON_KEY }}
          FORCE_RESEND:           ${{ github.event.inputs.force }}
          SCAN_DATE:              ${{ github.event.inputs.scan_date }}
        run: python scripts/highlight_scan.py

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain data/highlights)" ]; then
            git add data/highlights
            git commit -m "data: highlight scan $(date -u +%Y-%m-%d)"
            git pull --rebase origin master
            git push
          else
            echo "No changes."
          fi
