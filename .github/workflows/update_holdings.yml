name: Update Holdings Store

on:
  schedule:
    - cron: '30 9 * * 1-5'   # 平日 17:30 台北（UTC+8）＝ 09:30 UTC，收盤後
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    # BOT_DEPLOY_KEY 存在 environment「bot」，GitHub 伺服器端限定只有 master 能取用
    environment: bot
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7
        with:
          # deploy key 可繞過 master 保護規則（ruleset protect-master），GITHUB_TOKEN 不行；key 只在 environment bot
          ssh-key: ${{ secrets.BOT_DEPLOY_KEY }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Update holdings store
        run: python scripts/update_holdings.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain data/holdings)" ]; then
            git add data/holdings
            git commit -m "data: update holdings $(date -u +%Y-%m-%d)"
            git push
          else
            echo "No changes."
          fi
